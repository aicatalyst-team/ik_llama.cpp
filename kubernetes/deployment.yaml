apiVersion: apps/v1
kind: Deployment
metadata:
  name: ik-llama-cpp
  namespace: ik-llama-cpp
  labels:
    app.kubernetes.io/name: ik-llama-cpp
    app.kubernetes.io/component: ik-llama-cpp
    app.kubernetes.io/managed-by: autopoc
spec:
  replicas: 1
  # Recreate strategy: the PVC is ReadWriteOnce so RollingUpdate would
  # deadlock — the new pod can't mount the PVC while the old pod holds it.
  strategy:
    type: Recreate
  # Allow up to 1800 seconds (30 min) for rollout.
  # The model download from HuggingFace (~400 MB) plus model loading into
  # memory can take significant time, especially on slower networks or when
  # HuggingFace CDN is congested. Previous attempt timed out at 900s.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: ik-llama-cpp
      app.kubernetes.io/component: ik-llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ik-llama-cpp
        app.kubernetes.io/component: ik-llama-cpp
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ik-llama-cpp
          image: quay.io/aicatalyst/ik_llama.cpp-ik_llama.cpp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LLAMA_MODEL_URL
              value: "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-IQ4_NL.gguf"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          # ---------------------------------------------------------
          # Startup probe: dominates during initial bring-up.
          # Allows up to 1500s (150 × 10s) for the entrypoint to
          # download the ~400 MB GGUF model AND load it into memory.
          # Once this probe succeeds, readiness/liveness take over.
          # ---------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 150
          # Readiness: controls traffic routing — quick check once
          # the startup probe has passed.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness: restarts the container if it stops responding.
          # Generous thresholds to avoid killing during large-context
          # inference that may temporarily block the event loop.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: ik-llama-cpp-models
