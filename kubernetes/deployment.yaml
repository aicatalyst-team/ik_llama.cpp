apiVersion: apps/v1
kind: Deployment
metadata:
  name: ik-llama-cpp
  namespace: ik-llama-cpp
  labels:
    app.kubernetes.io/name: ik-llama-cpp
    app.kubernetes.io/component: ik-llama-cpp
    app.kubernetes.io/managed-by: autopoc
spec:
  replicas: 1
  # CRITICAL: Use Recreate strategy because the PVC is ReadWriteOnce.
  # RollingUpdate would deadlock — the new pod cannot mount the PVC while
  # the old pod still has it, so the old pod never terminates.
  strategy:
    type: Recreate
  # Allow up to 900 seconds for rollout (model download + loading)
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: ik-llama-cpp
      app.kubernetes.io/component: ik-llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ik-llama-cpp
        app.kubernetes.io/component: ik-llama-cpp
    spec:
      # Give the pod enough time to download and load the model
      terminationGracePeriodSeconds: 30
      initContainers:
        # Download the GGUF model to the PVC before the main container starts.
        # Uses registry.access.redhat.com/ubi9/ubi which ships with curl by
        # default — unlike ubi-minimal which only has libcurl-minimal (no CLI).
        - name: model-downloader
          image: registry.access.redhat.com/ubi9/ubi:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              MODEL_PATH="/models/model.gguf"
              if [ -f "$MODEL_PATH" ]; then
                echo "Model already present at $MODEL_PATH — skipping download."
                ls -lh "$MODEL_PATH"
                exit 0
              fi
              echo "Downloading model from $LLAMA_MODEL_URL ..."
              curl -fSL --progress-bar --retry 3 --retry-delay 5 \
                   -o "$MODEL_PATH.tmp" "$LLAMA_MODEL_URL"
              mv "$MODEL_PATH.tmp" "$MODEL_PATH"
              echo "Download complete:"
              ls -lh "$MODEL_PATH"
          env:
            - name: LLAMA_MODEL_URL
              value: "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-IQ4_NL.gguf"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ik-llama-cpp
          image: quay.io/aicatalyst/ik_llama.cpp-ik_llama.cpp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LLAMA_MODEL_URL
              value: "https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/main/Qwen_Qwen3-0.6B-IQ4_NL.gguf"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          # Startup probe: allow up to 600s (60 × 10s) for model loading.
          # The init container already downloaded the model, so this covers
          # only the time to mmap/load the GGUF into memory and warm up.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: ik-llama-cpp-models
